<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de multa</title>

    <style>
        body {
            background-color: blue;
            max-width: 660px;
            max-height: 400px;
            color: white;
            font-size: 25px;
        }

        fieldset {
            width: 100%;
            text-align: justify;
            margin: 50%;
        }

        #titulo {
            font-size: 30px;
            color: rgb(16, 238, 16);
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            margin-right: 9px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        #nome {
            width: 200px;
        }

        #endereço {
            width: 230px;
        }

        #estado {
            margin-right: 150px;
            width: 200px;
        }

        #cep {
            width: 100px;
        }
    </style>

</head>
<body>

    <fieldset>

        <legend id="titulo">Sistama do Detran</legend>

        Nome: <input type="text" name="nome" id="nome">

        Endereço: <input type="" name="endereço" id="endereço">

        Data: <input type="date" name="" id="">

        Estado: <input type="text" name="estado" id="estado">

        Cep: <input type="text" name="cep" id="cep">

        E-mail: <input type="email" name="e-mail" id="e-mail">

    </fieldset>
</body>
</html>
