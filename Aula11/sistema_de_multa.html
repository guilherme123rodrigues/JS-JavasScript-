<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de multa</title>

    <style>
        body {
            background-color: blue;
            max-width: 660px;
            max-height: 400px;
            color: white;
            font-size: 25px;
        }

        fieldset {
            width: 100%;
            text-align: justify;
            margin: 40% 50% 0 50%;
        }

        #titulo {
            font-size: 30px;
            color: rgb(16, 238, 16);
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            margin-right: 9px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        #nome {
            width: 200px;
        }

        #endereço {
            width: 230px;
        }

        #estado {
            margin-right: 150px;
            width: 200px;
        }

        #cep {
            width: 100px;
        }

        #registrar {
            background-color: green;
            color: white
        }

        #msg {
            font-size: 15px;
            color: rgb(0, 247, 0);
            font-weight: bold;
        }

    </style>

</head>
<body>

    <fieldset>

        <legend id="titulo">Sistama do Detran</legend>

        <label>
            Nome: <input type="text" name="nome" id="nome" required>
        </label>

        <label>
            Endereço: <input type="" name="endereço" id="endereço" required>
        </label>

        <label>
            Data: <input type="date" name="data" id="data" required>
            </label>
        
        <label>
            Estado: <input type="text" name="estado" 
            id="estado" required>
        </label>

        <label>
            Cep: <input type="text" name="cep" id="cep" required>
        </label>

        <label>
            E-mail: <input type="email" name="e-mail" id="e-mail" required>
        </label>

        <input type="button" value="Registrar" id="registrar">

        <p id="msg"></p>

    </fieldset>

    <script>
        let registro = window.document.querySelector('#registrar')

        registro.addEventListener('click', () => {
            let nome = window.document.querySelector('#nome')
            let endereco = window.document.querySelector('#endereço')
            let data = window.document.querySelector('#data')
            let estado = window.document.querySelector('#estado')
            let cep = window.document.querySelector('#cep')
            let email = window.document.querySelector('#e-mail')
            let msg = window.document.querySelector('#msg')

            nome.value = ''
            endereco.value = ''
            data.value = ''
            estado.value = ''
            estado.value = ''
            cep.value = ''
            email.value = ''
            msg.textContent = 'Registrado no sistema'
        })
    </script>
</body>
</html>
