<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Iniciando os estido no DOM</title>
</head>
<body>
    <header>
        <h1 id="titulo">Iniciando estudos DOM</h1>
    </header>
    
    <div>
        <nav id="menu">
            <ul>
                <li>Olá</li>
                <li>Tudo</li>
                <li>Bem</li>
            </ul>
        </nav>
    </div>

    <script>
        let cabeçalho = window.document.getElementById('titulo')
        cabeçalho.style.color = 'green'
        cabeçalho.style.fontFamily = 'Arial'

        const menuzinho = window.document.getElementById('menu')
        menuzinho.style.backgroundColor = 'rgb(123, 232, 252)'
        menuzinho.style.padding = '3px'
    </script>

</body>
</html>
