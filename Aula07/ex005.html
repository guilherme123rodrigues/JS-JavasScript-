<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Iniciando os estido no DOM</title>

    <style>
        tr .semana {
            color: blue;
        }
    </style>

</head>
<body>

    <div>

            </tr>

            <tr>

</html>
