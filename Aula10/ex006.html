<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>

    <style>
        div#area {
            background-color: rgb(119, 128, 7);
            color: rgb(255, 253, 250);
            font-weight: bold;
            font-size: 15px;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        };
    </style>

</head>
<body>
    <div id="area">
        Formula: 
        10 * 19 / 4 ** 2
    </div>

    <script>

        let a = window.document.getElementById('area')

        a.addEventListener('mouseenter', entrar);
        a.addEventListener('mouseout', sair);
        a.addEventListener('click', clicar);

        function entrar(){
            a.innerHTML = '<b style="font-size: 14px">Clique para ver o resultado!</b>';
            a.style.backgroundColor= 'green';
        };

        function sair(){
            a.innerText = 'Formula: 10 * 19 / 4 ** 2';
            a.style.backgroundColor = 'rgb(119, 128, 7)';
        };

        function clicar(){
            var valor = 10 * 19 / 4 ** 4;
        
            a.style.backgroundColor = 'black';
            a.innerHTML = `Resultado: <strong style="color: orange">${valor}</strong>`
        };

    </script>

</body>
</html>
