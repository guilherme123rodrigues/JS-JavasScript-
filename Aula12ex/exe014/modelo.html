<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>

    <link rel="stylesheet" href="estilo.css">

</head>
<body>
    <header id="titulo">
        <h1>Verificador de idade</h1>
    </header>

    <main>
        <fieldset id="conteudo">
            <label for="ano">Ano de nascimento</label>
            <input type="number" name="fano" id="fano" placeholder="Digite aqui!">

            <label for="sexo" id="sexo">Sexo:</label>
            <input type="radio" name="sexo" id="masc" checked> Masculino
            <input type="radio" name="sexo" id="femi"> Feminino

            <input type="button" value="Verificar" id="botao" onclick="verificar()">

            <div id="resultado">
                detectar gênero
            </div>
        </fieldset>

    </main>

    <footer>
        <p>&copy; GuilhermeRodrigues</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
